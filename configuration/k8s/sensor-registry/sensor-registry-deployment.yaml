apiVersion: apps/v1
kind: Deployment

metadata:
  name: sensor-registry
  namespace: backend

  labels:
    app: sensor-registry
    group: sensor-registry


spec:
  replicas: 1

  selector:
    matchLabels:
      group: sensor-registry

  template:
    metadata:
      labels: 
        app: sensor-registry
        group: sensor-registry

    spec:
      containers:
        - name: sensor-registry
          image: sensor-registry:latest
          
          ports:
          - containerPort: 8081
          env:
          - name: ASPNETCORE_URLS
            value: "http://+:8081"