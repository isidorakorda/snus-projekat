apiVersion: apps/v1
kind: Deployment

metadata:
  name: postgres
  namespace: backend
  labels:
    app: postgres
    group: db

spec:
  replicas: 1

  selector:
    matchLabels:
      app: postgres
  
  template:
    metadata:
      labels:
        app: postgres
        group: db

    spec:
      volumes:
        - name: "postgres-storage"
          persistentVolumeClaim:
            claimName: postgres-pvc

      containers:
        - name: snus-db
          image: postgres:16-alpine
          ports:
            - containerPort: 5432

          envFrom:
            - secretRef:
                name: postgres-secrets

          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata

          volumeMounts:                 
            - name: postgres-storage               
              mountPath: /var/lib/postgresql/data  

          resources:
            limits:
              memory: "256Mi"
              cpu: "500m"      

